<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2747D8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>중학 영단어장</title>
<meta name="description" content="중학생을 위한 영어 단어 복습 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영단어장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: one centered study column (max 760px); bottom tab bar on phones, header segment tabs on desktop.
   Identity: blue ink on cool paper, a yellow highlighter marks the target word in every example. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#EBEFF6; --ink:#141C2B; --muted:#5A6577; --line:#DAE0EA;
  --accent:#2747D8; --accent-ink:#FFFFFF; --accent-soft:#E4E9FC;
  --mark:#FFE766; --mark-ink:#141C2B;
  --ok:#17864C; --ok-soft:#E0F3E7; --bad:#C63A32; --bad-soft:#FBE5E3; --warn:#B25B00;
  --h0:#E3E8F0; --h1:#C3E9CF; --h2:#82D09F; --h3:#3AAA68; --h4:#1B7643;
  --shadow:0 1px 2px rgba(20,28,43,.05),0 6px 18px rgba(20,28,43,.06);
  --f-en:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161D2C; --surface2:#1D2638; --ink:#E7ECF5; --muted:#98A3B6; --line:#2A3448;
  --accent:#7D95FF; --accent-ink:#0E1320; --accent-soft:#1F2A4D;
  --mark:rgba(255,224,80,.28); --mark-ink:#FFF2A8;
  --ok:#4FCB87; --ok-soft:#163224; --bad:#FF7B70; --bad-soft:#3A1D1D; --warn:#F2A54A;
  --h0:#1E2638; --h1:#1E4A33; --h2:#23704A; --h3:#2F9E63; --h4:#5FD593;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2C; --surface2:#1D2638; --ink:#E7ECF5; --muted:#98A3B6; --line:#2A3448;
  --accent:#7D95FF; --accent-ink:#0E1320; --accent-soft:#1F2A4D;
  --mark:rgba(255,224,80,.28); --mark-ink:#FFF2A8;
  --ok:#4FCB87; --ok-soft:#163224; --bad:#FF7B70; --bad-soft:#3A1D1D; --warn:#F2A54A;
  --h0:#1E2638; --h1:#1E4A33; --h2:#23704A; --h3:#2F9E63; --h4:#5FD593;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
.en{font-family:var(--f-en)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:var(--mark-ink);padding:0 2px;border-radius:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand h1{font-family:var(--f-en);font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand h1 b{color:var(--accent);font-weight:700}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.seg-tabs{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg-tabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.seg-tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.tabbar{display:none}
@media (max-width:720px){
  .brand small{display:none}
  .seg-tabs{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--muted);font-weight:500}
  .tabbar svg{width:23px;height:23px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
}

/* cards & common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.big{width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:16px 20px;text-align:left;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 30%,transparent)}
.big .t{font-size:18px;font-weight:700;display:block}
.big .s{font-size:13.5px;opacity:.88;display:block;margin-top:2px}
.big .arr{margin-left:auto;font-size:22px;flex:none}
.big.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.big.soft .t{font-size:15.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{border:0;background:none;color:var(--mark);font-weight:700;padding:0}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:70;background:var(--accent);color:var(--accent-ink);padding:10px 12px 10px 16px;border-radius:12px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(20,28,43,.25)}
.upd button{border:0;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;background:var(--accent-ink);color:var(--accent)}
.upd button.x{background:none;color:var(--accent-ink);padding:6px;font-weight:500;opacity:.85}
.install{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--accent);background:var(--accent-soft)}
.install b{font-size:15px}
.install .share{display:inline-block;vertical-align:-3px;width:16px;height:16px}
@media (max-width:720px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.notice{padding:14px 16px;border-radius:12px;background:var(--surface2);font-size:14px}

/* today */
.today-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.today-head h2{font-size:17px;font-weight:700}
.prog-num{display:flex;align-items:baseline;justify-content:space-between}
.prog-num b{font-family:var(--f-en);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.prog-num b small{font-size:16px;color:var(--muted);font-weight:500}
.prog-num span{font-family:var(--f-en);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.done-box{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--ok-soft)}
.done-box svg{width:34px;height:34px;color:var(--ok);flex:none}
.done-box b{display:block;font-size:16.5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-size:15px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile em{font-style:normal;font-family:var(--f-en);font-weight:600;color:var(--accent)}
.tile:disabled{opacity:.45;cursor:default}
.sub-line{font-size:13.5px;color:var(--muted)}
.warn-line{font-size:13.5px;color:var(--warn)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-family:var(--f-en);font-weight:600}
.cal-nav{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.cal-nav:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11.5px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1/1;max-width:100%;border:0;border-radius:9px;background:var(--h0);font-family:var(--f-en);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0}
.cal button.l1{background:var(--h1);color:var(--ink)}
.cal button.l2{background:var(--h2);color:var(--ink)}
.cal button.l3{background:var(--h3);color:#fff}
.cal button.l4{background:var(--h4);color:#fff}
.cal button.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal button.future{opacity:.35;cursor:default}
.cal button.sel{box-shadow:0 0 0 2px var(--ink) inset}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.day-box{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.stats3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats3 div{background:var(--surface2);border-radius:10px;padding:8px;text-align:center}
.stats3 b{display:block;font-family:var(--f-en);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stats3 span{font-size:11.5px;color:var(--muted)}
.mini-list{display:flex;flex-direction:column;gap:6px}
.mini-list div{display:flex;gap:10px;align-items:baseline;font-size:14px}
.mini-list .en{font-weight:600;min-width:96px}
details.fold{border-top:1px solid var(--line);padding-top:12px}
details.fold summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.fold summary::after{content:"펼치기";color:var(--muted);font-weight:500;font-size:13px}
details.fold[open] summary::after{content:"접기"}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);margin:12px 0 8px}
.stack i{display:block;height:100%}
.lv-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.lv-legend span{display:inline-flex;align-items:center;gap:5px}
.lv-legend i{width:10px;height:10px;border-radius:3px}
.grade-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grade-badges div{flex:1;min-width:120px;background:var(--surface2);border-radius:10px;padding:10px}
.grade-badges b{font-family:var(--f-en);font-size:17px;font-weight:600}

/* word detail */
.wd{display:flex;flex-direction:column;gap:10px}
.wd-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wd-w{font-family:var(--f-en);font-size:28px;font-weight:600;letter-spacing:-.01em}
.pos{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.pron{font-size:14px;color:var(--muted)}
.ipa{font-family:var(--f-ipa)}
.kp{margin-left:6px}
.pron-tap{border:1px dashed var(--line);background:none;border-radius:7px;padding:2px 9px;font-size:12.5px;color:var(--muted)}
.wd-m{font-size:18px;font-weight:600}
.lbl{display:inline-block;font-size:11.5px;font-weight:600;color:var(--muted);margin-right:8px;letter-spacing:.02em}
.wd-forms,.wd-col{font-size:14.5px}
.wd-forms{font-family:var(--f-en)}
.wd-forms .lbl,.wd-col .lbl{font-family:var(--f-ui)}
.wd-col b{font-family:var(--f-en);font-weight:500}
.wd-ex{background:var(--surface2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wd-ex .en{font-size:16px;line-height:1.6}
.wd-ex .ko{font-size:13.5px;color:var(--muted)}
.wd-ex.extra{background:transparent;border:1px dashed var(--line)}
.wd-ex .link.small{font-size:12.5px}
.ex-tools{margin-top:2px}
.pt-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.my-box{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.wd-note{font-size:13.5px;padding-left:12px;border-left:3px solid var(--mark)}
.wd-group{font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.wd-group .mates{display:flex;flex-wrap:wrap;gap:6px}
.wd-group .mates span{background:var(--surface2);border-radius:8px;padding:3px 8px;font-size:13px}
.wd-group .mates b{font-family:var(--f-en);font-weight:600;margin-right:4px}
.spk{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;vertical-align:middle;color:var(--accent);flex:none;padding:0}
.spk svg{width:17px;height:17px}
.spk.sm{width:26px;height:26px}
.spk.sm svg{width:14px;height:14px}

/* book */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .search{grid-column:1/-1}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
textarea.field{resize:vertical;min-height:84px;line-height:1.5}
.search{font-size:16px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 16px}
.row:last-child{border-bottom:0}
.row .r-w{font-family:var(--f-en);font-weight:600;font-size:16px;overflow-wrap:anywhere}
.row .r-m{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.row-open{padding:4px 16px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface2) 45%,var(--surface))}
.flag-dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block;margin-left:6px;vertical-align:middle}

/* quiz */
#quiz{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.qz{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.qz-top{display:flex;align-items:center;gap:12px}
.qz-top .bar{flex:1}
.qz-top .cnt{font-family:var(--f-en);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qz-quit{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0;white-space:nowrap}
.q-kicker{font-size:13px;font-weight:600;color:var(--muted)}
.q-prompt{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.q-word{font-family:var(--f-en);font-size:40px;font-weight:600;letter-spacing:-.015em;line-height:1.15;display:flex;align-items:center;gap:12px;flex-wrap:wrap;overflow-wrap:anywhere}
.q-ko{font-size:28px;font-weight:700;line-height:1.3}
.q-listen{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;align-self:center;margin:10px 0}
.q-listen svg{width:40px;height:40px}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:center;font-size:16px;min-height:56px}
.opt .k{font-family:var(--f-en);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt.en-opt{font-family:var(--f-en);font-size:18px;font-weight:500}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.q-sent{font-family:var(--f-en);font-size:18px;line-height:1.7;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.q-sent .ko{display:block;font-family:var(--f-ui);font-size:13.5px;color:var(--muted);margin-top:4px}
.blank{display:inline-block;min-width:84px;border-bottom:2.5px solid var(--accent);margin:0 3px;transform:translateY(-3px)}
.spell-in{font-family:var(--f-en);font-size:24px;padding:12px 14px;text-align:center;letter-spacing:.02em;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%}
.spell-in:focus{border-color:var(--accent);outline:none}
.spell-in.ko{font-family:var(--f-ui);letter-spacing:0;font-size:21px}
.hint.ko{font-family:var(--f-ui);letter-spacing:.15em}
.test-rows{display:flex;flex-direction:column;gap:2px}
.tr{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.tr .mk{font-weight:700;font-size:16px;text-align:center}
.tr.ok .mk{color:var(--ok)}.tr.no .mk{color:var(--bad)}.tr.q .mk{color:var(--warn)}
.tr .blank{min-width:48px}
.seg button:disabled{opacity:.4;cursor:default}
.hint{font-family:var(--f-en);font-size:18px;letter-spacing:.25em;color:var(--muted);text-align:center}
.fb{border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:500;color:var(--ink);font-size:14px;margin-top:2px}
.diff{font-family:var(--f-en);font-size:18px;letter-spacing:.04em}
.diff .x{color:var(--bad);text-decoration:line-through}
.diff .y{color:var(--ok);font-weight:600}
.qz-foot{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);margin-top:auto}
.qz-foot .btn{width:100%;padding:15px;font-size:16px}
.new-badge{background:var(--mark);color:var(--mark-ink);font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px;align-self:flex-start}
.sum-big{font-family:var(--f-en);font-size:46px;font-weight:600;line-height:1}

/* speak */
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sent-big{font-family:var(--f-en);font-size:21px;line-height:1.6}
.sent-big.hidden-text{filter:blur(7px);user-select:none}
.cmp{font-family:var(--f-en);font-size:17px;line-height:1.8}
.cmp .hit{color:var(--ok);font-weight:600}
.cmp .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.score{font-family:var(--f-en);font-size:28px;font-weight:600}
.scenes{display:flex;flex-wrap:wrap;gap:6px}
.scenes button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px}
.scenes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.dlg-lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start}
.line .who{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.line.B .who{background:var(--mark);color:var(--mark-ink)}
.line .en{font-size:16px;line-height:1.5}
.line .ko{font-size:13px;color:var(--muted)}
.line .masked{color:var(--muted);font-family:var(--f-ui);font-style:italic}
.dlg-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;padding:12px 0}
.dlg-item:last-child{border-bottom:0}
.fix{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:14px}
.fix .en{font-size:15px}
.fix s{color:var(--bad)}
.fix b{color:var(--ok);font-weight:600}
.stars{color:var(--warn);font-size:20px;letter-spacing:2px}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk li{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.45}
.chk .mk{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.chk .ok .mk{background:var(--ok-soft);color:var(--ok)}
.chk .no .mk{background:var(--bad-soft);color:var(--bad)}
.chk .tip .mk{background:var(--accent-soft);color:var(--accent)}

/* manage */
.preview{display:flex;flex-direction:column;gap:10px}
.pv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.pv input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--accent)}
.pv .en{font-weight:600;font-size:16px}
.pv p{font-size:13.5px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.form label.full{grid-column:1/-1}
.res-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.res-item:last-child{border-bottom:0}
.res-item .en{font-weight:600}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:480px;max-height:calc(100% - 32px);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
@media (max-width:720px){.sheet-bg{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-width:none;max-height:88%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.set-grp{display:flex;flex-direction:column;gap:8px}
.set-grp > b{font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:64px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:420px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.stats3{grid-template-columns:repeat(2,1fr)}.q-word{font-size:34px}.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1><b>English</b> 단어장</h1><small>중1 · 중2 · 중3</small></div>
    <nav class="seg-tabs" id="segTabs" aria-label="메뉴">
      <button data-act="tab" data-tab="today">오늘</button>
      <button data-act="tab" data-tab="book">단어장</button>
      <button data-act="tab" data-tab="speak">말하기</button>
      <button data-act="tab" data-tab="manage">단어 관리</button>
    </nav>
    <button class="icon-btn" data-act="settings" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main id="main" class="wrap"><div class="loading">단어를 불러오는 중…</div></main>
<section id="quiz" hidden></section>

<nav class="tabbar" id="tabbar" aria-label="메뉴">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>오늘</button>
  <button data-act="tab" data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>단어장</button>
  <button data-act="tab" data-tab="speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>말하기</button>
  <button data-act="tab" data-tab="manage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h10M4 18h7"/><path d="M18 14v6M15 17h6"/></svg>단어 관리</button>
</nav>

<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<div id="upd" class="upd" hidden role="status"><span>새 버전이 있어요</span><button data-act="upd-go">새로고침</button><button class="x" data-act="upd-x" aria-label="나중에">나중에</button></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const CAT={school:'학교·공부',daily:'일상·생활',people:'사람·관계',feel:'감정·성격',action:'동작·생각',describe:'묘사·상태',time:'시간·장소',nature:'자연·환경',society:'사회·문화',func:'연결어·부사'};
const POS={n:'명사',v:'동사',adj:'형용사',adv:'부사',prep:'전치사',conj:'접속사',pron:'대명사'};
const IV=[1,1,2,4,7,15];
const DEF_SET={newPerDay:10,sessionSize:10,deck:'all',lesson:'all',pron:'on',lastBackup:''};
const LVCOL=['var(--line)','#F2B8B0','#F6D28B','#BFE3A0','#7FCB9A','#3AAA68','#1B7643'];
/* filled from words.json at boot */
let QUESTIONS=[],TB={name:'',lessons:[]};
const lsName=k=>(TB.lessons.find(x=>x[0]===k)||[k,k])[1];
let SCENES=[];

const ic={
 spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>'
};

/* ---------- state ---------- */
const S={db:null,dl:null,state:'loading',tab:'today',base:null,baseW:new Map(),E:{},W:new Map(),P:new Map(),G:{},set:{...DEF_SET},stats:{streak:0,lastDay:'',best:0,days:{}},LOG:{},sess:null,psess:null,dlg:[],loadedAt:0,
 bk:{q:'',gr:'all',c:'all',st:'all',ls:'all',open:null,limit:80},
 cal:null,calDay:null,
 sp:{sub:'shadow',sh:null,hide:false,res:null,txt:'',qa:0,qaTxt:'',qaRes:null,scene:'all',open:null,role:null,ko:true,err:''},
 my:null,ptBusy:null,
 mg:{ls:'',txt:'',gr:1,preview:null,dups:[],err:'',q:'',edit:null},
 quiz:null};

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d);};
const WD=['일','월','화','수','목','금','토'];
const krDate=s=>{const d=parseD(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+WD[d.getDay()]+'요일';};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const exHTML=ex=>esc(ex).replace(/\[([^\]]+)\]/g,'<mark>$1</mark>');
const exBlank=ex=>esc(ex).replace(/\[([^\]]+)\]/g,'<span class="blank"></span>');
const exPlain=ex=>String(ex||'').replace(/\[([^\]]+)\]/g,'$1');
const inBr=ex=>{const m=/\[([^\]]+)\]/.exec(ex||'');return m?m[1]:'';};
const clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const posLabel=p=>(p||'').split('·').map(x=>POS[x]||x).join('·');
const ls={get(k,d){try{const v=localStorage.getItem('evb.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('evb.'+k,JSON.stringify(v));}catch(e){}}};

/* ---------- speech ---------- */
const TTS=typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';
let voice=null,seqToken=0;
function pickVoice(){if(!TTS)return;try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava|Allison/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
if(TTS){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){}}
function speak(text,opt={}){if(!TTS||!text)return;try{if(!opt.keep){seqToken++;speechSynthesis.cancel();}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=opt.rate||(ls.get('rate','n')==='s'?0.75:0.92);if(opt.pitch)u.pitch=opt.pitch;if(opt.onend)u.onend=opt.onend;speechSynthesis.speak(u);}catch(e){}}
function speakSeq(list){if(!TTS)return;seqToken++;const tok=seqToken;try{speechSynthesis.cancel();}catch(e){}let i=0;const next=()=>{if(tok!==seqToken||i>=list.length)return;const it=list[i++];speak(it.text,{keep:true,pitch:it.pitch,onend:()=>setTimeout(next,250)});};next();}
const autoSay=()=>ls.get('auto',true);
const spk=(t,sm,rate)=>TTS&&t?`<button class="spk${sm?' sm':''}" data-act="say" data-t="${esc(t)}"${rate?` data-r="${rate}"`:''} aria-label="듣기">${ic.spk}</button>`:'';

/* ---------- storage ---------- */
const chains={},timers={},pend={};let saveWarned=false;
function queue(path,fn){const p=(chains[path]||Promise.resolve()).then(fn).catch(err=>{console.warn('save failed',path,err);if(err&&err.code==='quota_exceeded')toast('저장 공간이 가득 찼어요. 단어나 대화를 조금 지워 주세요.');else if(!saveWarned){saveWarned=true;toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.');}});chains[path]=p;return p;}
function saveNow(path,data){if(!S.db||data==null)return Promise.resolve();const d=clone(data);return queue(path,()=>S.db.doc(path).set(d));}
function saveSoon(path,getter,ms=1200){pend[path]=getter;clearTimeout(timers[path]);timers[path]=setTimeout(()=>{const g=pend[path];delete pend[path];if(g)saveNow(path,g());},ms);}
function flush(){for(const path of Object.keys(pend)){clearTimeout(timers[path]);const g=pend[path];delete pend[path];saveNow(path,g());}}
const idle=()=>Promise.all(Object.values(chains));
// built-in words live in words.json; the learner's changes to them are kept as small per-word overrides.
// only fields that differ from words.json are stored, so later words.json updates still reach untouched fields.
const blank=v=>v==null||v===''||v===false||(Array.isArray(v)&&!v.length);
const sameVal=(a,b)=>blank(a)&&blank(b)||JSON.stringify(a)===JSON.stringify(b);
function saveOverride(w,fields){
  const b=S.baseW.get(w.id)||{},o={...(S.E[w.id]||{})};
  for(const [k,v] of Object.entries(fields)){if(sameVal(v,b[k]))delete o[k];else o[k]=clone(v);}
  S.E[w.id]=o;
  if(!S.db)return;
  if(Object.keys(o).length)saveNow('edits/'+w.id,o);else{delete S.E[w.id];queue('edits/'+w.id,()=>S.db.doc('edits/'+w.id).delete());}
}
function saveWordField(w,fields){Object.assign(w,fields);if(w.src==='base')saveOverride(w,fields);else{const {id,src,...rest}=w;saveNow('words/'+id,rest);}}
function saveSettings(){saveNow('meta/settings',S.set);}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">되돌리기</button>':''}`;t.hidden=false;toast.undo=undo||null;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;toast.undo=null;},undo?8000:3500);}

/* ---------- load ---------- */
// built-in data (words, confusing pairs, dialogs, speaking questions, textbook lessons) comes from words.json;
// the device only keeps the learner's own data: progress, logs, settings, own words, and overrides of built-in words.
async function loadBase(){
  const r=await fetch('words.json',{cache:'no-cache'});
  if(!r.ok)throw new Error('words.json '+r.status);
  const d=await r.json();
  if(!d||!Array.isArray(d.words))throw new Error('words.json: no words');
  S.base=d;
  S.baseW=new Map(d.words.filter(w=>w&&w.id&&w.w).map(w=>[w.id,w]));
  S.G=d.groups||{};
  QUESTIONS=Array.isArray(d.questions)?d.questions:[];
  TB=d.textbook&&Array.isArray(d.textbook.lessons)?d.textbook:{name:'',lessons:[]};
  SCENES=Array.isArray(d.scenes)?d.scenes:[...new Set((d.dialogs||[]).map(x=>x.scene).filter(Boolean))];
}
async function loadAll(){
  const db=S.db;
  const [users,edits,progs,metas,logs,dlg]=await Promise.all([
    db.collection('words').get(),db.collection('edits').get(),db.collection('prog').get(),
    db.collection('meta').get(),db.collection('log').get(),db.collection('dialogs').get()]);
  S.E={};for(const d of edits.docs){const x=d.data();if(x&&typeof x==='object')S.E[d.id]=clone(x);}
  const W=new Map();
  for(const [id,b] of S.baseW)W.set(id,{...clone(b),...(S.E[id]||{}),id,src:'base'});
  for(const d of users.docs){const it=d.data();if(it&&it.w)W.set(d.id,{...clone(it),id:d.id,src:'user'});}
  S.W=W;
  S.P=new Map(progs.docs.map(d=>[d.id,clone(d.data())]));
  const meta={};for(const d of metas.docs)meta[d.id]=clone(d.data())||{};
  S.set={...DEF_SET,...(meta.settings||{})};
  S.stats={streak:0,lastDay:'',best:0,days:{},...(meta.stats||{})};S.stats.days=S.stats.days||{};
  const t=today();
  S.sess=meta.session&&Array.isArray(meta.session.items)&&meta.session.day===t?meta.session:null;
  S.psess=meta.psession&&Array.isArray(meta.psession.items)&&meta.psession.day===t?meta.psession:null;
  S.LOG={};for(const d of logs.docs){const x=clone(d.data())||{};S.LOG[d.id]={days:x.days||{}};}
  const baseDlg=(S.base.dialogs||[]).filter(d=>d&&d.id&&Array.isArray(d.lines)).map(d=>({...clone(d),src:'base'}));
  const baseIds=new Set(baseDlg.map(d=>d.id));
  const own=dlg.docs.filter(d=>!baseIds.has(d.id)).map(d=>({...clone(d.data()),id:d.id,src:'user'})).sort((a,b)=>(b.at||0)-(a.at||0));
  S.dlg=[...own,...baseDlg];
  S.loadedAt=Date.now();
}
// fields of a stored copy of a built-in word that differ from words.json
function diffBase(id,item){
  const b=S.baseW.get(id)||{},o={};
  for(const [k,v] of Object.entries(item||{})){if(['id','pk','src','n'].includes(k))continue;if(!sameVal(v,b[k]))o[k]=clone(v);}
  return o;
}
// earlier versions copied every built-in word into the device; turn those copies into overrides once
function migrateOld(db){
  const pre='evb.db:packs/',keys=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre))keys.push(k.slice('evb.db:'.length));}
  if(!keys.length)return;
  for(const path of keys){const items=(db.rd(path)||{}).items||{};
    for(const [id,it] of Object.entries(items)){if(!S.baseW.has(id)){if(it&&it.w&&!db.rd('words/'+id)){const {pk,...f}=it;db.wr('words/'+id,f);}continue;}
      const o={...(db.rd('edits/'+id)||{}),...diffBase(id,it)};if(Object.keys(o).length)db.wr('edits/'+id,o);}}
  for(const path of keys)localStorage.removeItem('evb.db:'+path);
  for(const k of ['meta/groups','meta/seeded'])localStorage.removeItem('evb.db:'+k);
}
/* ---------- local storage database ---------- */
function makeLocalDB(){
  const P='evb.db:';
  try{localStorage.setItem(P+'__t','1');localStorage.removeItem(P+'__t');}catch(e){return null;}
  const rd=p=>{try{const v=localStorage.getItem(P+p);return v==null?undefined:JSON.parse(v);}catch(e){return undefined;}};
  const wr=(p,v)=>{try{localStorage.setItem(P+p,JSON.stringify(v));}catch(e){throw {code:'quota_exceeded',message:String(e)};}};
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const merge=(a,b)=>{const o={...(a||{})};for(const [k,v] of Object.entries(b||{})){o[k]=isObj(v)&&isObj(o[k])?merge(o[k],v):v;}return o;};
  const snap=(id,data)=>({id,exists:data!==undefined,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}});
  const doc=path=>({id:path.split('/').pop(),path,
    get:async()=>snap(path.split('/').pop(),rd(path)),
    set:async d=>wr(path,d),
    update:async d=>{const cur=rd(path);if(cur===undefined)throw {code:'invalid_argument',message:'missing document'};wr(path,merge(cur,d));},
    delete:async()=>{try{localStorage.removeItem(P+path);}catch(e){}}});
  const collection=path=>{const q={limit:()=>q,orderBy:()=>q,where:()=>q,doc:id=>doc(path+'/'+id),
    get:async()=>{const pre=P+path+'/',ids=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre)&&!k.slice(pre.length).includes('/'))ids.push(k.slice(pre.length));}
      ids.sort();const docs=ids.map(id=>snap(id,rd(path+'/'+id)));return {docs,size:docs.length,empty:!docs.length};}};return q;};
  return {doc,collection,rd,wr,merge};
}
const fileSaver={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);return {status:'saved'};}};

const allWords=()=>[...S.W.values()].filter(w=>!w.hid).sort((a,b)=>(a.n||0)-(b.n||0));
const inTB=(w,l)=>Array.isArray(w.lss)&&w.lss.length>0&&(!l||l==='all'||w.lss.includes(l));
const inDeck=(w,deck=S.set.deck,les=S.set.lesson)=>deck==='all'||(deck==='g1'&&w.gr===1)||(deck==='g2'&&w.gr===2)||(deck==='g3'&&w.gr===3)||(deck==='tb'&&inTB(w,les));
const deckWords=()=>allWords().filter(w=>w.m&&inDeck(w));
const learned=id=>{const p=S.P.get(id);return !!(p&&p.first);};
function computeToday(){
  const t=today(),words=deckWords();
  const done=[],due=[],fresh=[];
  for(const w of words){const p=S.P.get(w.id);
    if(p&&(p.lastOk===t||p.lastMiss===t)){done.push(w);continue;}
    if(p&&p.first){if(p.due&&p.due<=t)due.push(w);} else fresh.push(w);}
  due.sort((a,b)=>{const pa=S.P.get(a.id),pb=S.P.get(b.id);return pa.due<pb.due?-1:pa.due>pb.due?1:(pb.miss||0)-(pa.miss||0);});
  const newToday=allWords().filter(w=>{const p=S.P.get(w.id);return p&&p.first===t;}).length;
  const quota=Math.max(0,S.set.newPerDay-newToday);
  return {done,due,fresh:fresh.slice(0,quota),freshAll:fresh.length,newToday};
}
function streakNow(){const t=today(),st=S.stats;return st.lastDay===t||st.lastDay===addDays(t,-1)?(st.streak||0):0;}
const flagged=()=>allWords().filter(w=>{const p=S.P.get(w.id);return p&&p.flag;});
const often=()=>allWords().filter(w=>{const p=S.P.get(w.id);return p&&(p.miss||0)>=3;});
const learnedWords=()=>allWords().filter(w=>learned(w.id));

/* ---------- writing self-check (no AI: simple rules a beginner can act on) ---------- */
// the sentence with the target word (or one of its verb forms) wrapped in [ ], or '' if it is not there
function hasWordIn(text,w){
  for(const f of [w.w,...String(w.forms||'').split(/\s*[-–,/]\s*/)]){if(!f||!f.trim())continue;const b=bracketIt(text,f.trim());if(b!==text)return b;}
  return '';
}
function checkWriting(text,o={}){
  const s=String(text||'').trim(),out=[],add=(k,msg)=>out.push({k,msg});
  if(/[가-힣]/.test(s))add('no','우리말이 섞여 있어요. 영어로만 써 보세요.');
  add(/^["'(]?[A-Z]/.test(s)?'ok':'no',/^["'(]?[A-Z]/.test(s)?'대문자로 시작했어요.':'문장의 첫 글자는 대문자로 써요.');
  add(/[.!?]["')]?$/.test(s)?'ok':'no',/[.!?]["')]?$/.test(s)?'문장 끝에 문장부호를 찍었어요.':'문장 끝에 마침표(.)나 물음표(?)를 찍어요.');
  if(/(^|[^A-Za-z'’])i([^A-Za-z'’]|$)/.test(s))add('no',"'나'를 뜻하는 I는 언제나 대문자로 써요.");
  if(/[,.!?][A-Za-z]/.test(s))add('no','쉼표나 마침표 뒤에는 한 칸 띄어 써요.');
  if(o.starter){const st=o.starter.split('/')[0].split('...')[0].trim().replace(/[.,]$/,'');
    if(st.split(/\s+/).length>=2)add(s.toLowerCase().includes(st.toLowerCase())?'ok':'tip',s.toLowerCase().includes(st.toLowerCase())?`시작 문장 '${st}'을(를) 잘 썼어요.`:`'${o.starter}'로 시작하면 쉽게 쓸 수 있어요.`);}
  if(o.minSent){const n=(s.match(/[.!?]+(?=\s|$)/g)||[]).length;add(n>=o.minSent?'ok':'tip',n>=o.minSent?`${n}문장으로 썼어요.`:'이유나 예를 들어 한 문장 더 붙여 보세요.');}
  if(o.minWords){const n=s.split(/\s+/).filter(Boolean).length;if(n<o.minWords)add('tip',`조금 더 길게 써 볼까요? 지금 ${n}단어예요.`);}
  return out;
}
function checksHTML(items){
  const bad=items.filter(i=>i.k==='no').length;
  return `<div class="row-between"><b>${bad?`고칠 곳이 ${bad}개 있어요`:'기본 점검을 모두 통과했어요!'}</b></div>

}
function checkMine(id){
  const w=S.W.get(id),my=S.my;if(!w||!my)return;const inp=$('#my-in');my.txt=inp?inp.value.trim():my.txt.trim();

function spellSent(w,q){
  const list=[{ex:w.ex,ko:w.ko},...(w.exs||[])].filter(x=>x&&x.ex&&/\[[^\]]+\]/.test(x.ex));
  if(!list.length)return {ex:'',ko:''};

}

function bookFiltered(){

    const p=S.P.get(w.id),lv=p&&p.first?(p.lv||0):-1;

function pickShadow(){
  let pool=learnedWords().filter(w=>w.ex);if(pool.length<5)pool=deckWords().filter(w=>w.ex);
  if(!pool.length)return null;const prev=S.sp.sh;let w;for(let k=0;k<5;k++){w=pool[Math.random()*pool.length|0];if(w.id!==prev)break;}const n=(w.exs||[]).length;S.sp.shx=n&&Math.random()<n/(n+1)?Math.random()*n|0:null;return w.id;
}
const toks=s=>String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean);
function compare(target,said){
  const a=toks(target),b=toks(said);const n=a.length,m=b.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  const words=String(target).split(/\s+/);let k=0;
  const html=words.map(wd=>{const t=toks(wd);if(!t.length)return esc(wd);const ok=t.every(()=>hit[k++]);return `<span class="${ok?'hit':'miss'}">${esc(wd)}</span>`;}).join(' ');
  return {html,score:n?Math.round(hit.filter(Boolean).length/n*100):0};
}

/* ---------- sessions ---------- */
const pickOne=a=>a[Math.random()*a.length|0];
function qtFor(id){const p=S.P.get(id);const lv=p&&p.first?(p.lv||0):0;
  if(lv<=0)return 'mean';if(lv===1)return 'en';if(lv===2)return pickOne(TTS?['listen','ek']:['ek','en']);if(lv===3)return pickOne(['spell','kw']);return pickOne(['spell','kw','ek']);}
function buildItems(ids,opt={}){
  if(opt.practice)return ids.map(id=>({id,t:'q',qt:opt.qt||qtFor(id)}));
  const fresh=ids.filter(id=>!learned(id)),rev=shuffle(ids.filter(id=>learned(id)).map(id=>({id,t:'q',qt:qtFor(id)})));
  if(!fresh.length)return rev;
  const chunks=[];for(let i=0;i<fresh.length;i+=5)chunks.push(fresh.slice(i,i+5));
  const per=Math.ceil(rev.length/chunks.length),items=[];
  for(const ch of chunks){
    items.push(...ch.map(id=>({id,t:'card'})));
    // ask new words in the order they were shown, mixed with reviews, so each card is followed by a few other steps before its question
    const nq=ch.map(id=>({id,t:'q',qt:'mean'})),rv=rev.splice(0,per),mix=[];
    while(nq.length||rv.length){if(rv.length&&(!nq.length||Math.random()<0.5))mix.push(rv.shift());else mix.push(nq.shift());}
    items.push(...mix);
  }
  items.push(...rev);
  items.push(...shuffle(fresh.map(id=>({id,t:'q',qt:'en',x:1}))));
  return items;
}
function startToday(){
  const t=today();
  if(S.sess&&S.sess.day===t&&S.sess.i<S.sess.items.length){openQuiz('today');return;}
  const c=computeToday(),n=S.set.sessionSize;

  const fresh=c.fresh.slice(0,Math.max(0,n-rev.length)).map(w=>w.id);

  S.sess={day:t,mode:'today',title:'오늘 학습',practice:false,items:buildItems([...rev,...fresh]),i:0,q:0,ok:0,miss:[]};
  saveNow('meta/session',S.sess);openQuiz('today');
}

/* ---------- answer checking ---------- */
const normEn=x=>String(x||'').trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.!?,]+$/,'');
function koParts(m){const out=new Set();String(m||'').split(/[,;/]/).forEach(p=>{const a=p.replace(/\([^)]*\)/g,'').replace(/[~\s.·]/g,'');const b=p.replace(/[()~\s.·]/g,'');if(a)out.add(a);if(b)out.add(b);});return out;}
const matchKo=(inp,m)=>{const x=String(inp||'').replace(/[()~\s.·,]/g,'');return !!x&&koParts(m).has(x);};
function resolveQt(it,w,holder){let qt=it.qt;if(qt==='listen'&&!TTS)qt='en';if(qt==='spell'&&!spellSent(w,holder).ex)qt='kw';return qt;}
function enOk(inp,w,br){const a=normEn(inp);return !!a&&(a===normEn(w.w)||(!!br&&a===normEn(br)));}
function gradeItem(it){const w=S.W.get(it.id);if(!w)return true;const inp=it.res&&it.res.input||'';if(!inp)return false;
  const qt=resolveQt(it,w,it);
  if(qt==='ek'){if(it.res.self!=null)return it.res.self;return matchKo(inp,w.m)?true:null;}
  return enOk(inp,w,qt==='spell'?inBr(spellSent(w,it).ex):'');}

function openQuiz(kind){S.quiz={kind,idx:null,answered:false,ok:null,opts:null,pick:null,input:'',hint:false};$('#quiz').hidden=false;$('#main').hidden=true;$('#tabbar').style.display='none';document.body.style.overflow='hidden';renderQuiz();}
function closeQuiz(){flush();S.quiz=null;$('#quiz').hidden=true;$('#quiz').innerHTML='';$('#main').hidden=false;$('#tabbar').style.display='';document.body.style.overflow='';try{speechSynthesis.cancel();}catch(e){}render();window.scrollTo(0,0);}
function distract(w,field,n=3){
  const all=allWords().filter(x=>x.id!==w.id&&x[field]&&x[field]!==w[field]&&x.w.toLowerCase()!==w.w.toLowerCase());
  const mates=shuffle(all.filter(x=>w.g&&x.g===w.g));
  const p0=(w.pos||'').split('·')[0];
  const same=shuffle(all.filter(x=>!mates.includes(x)&&(x.pos||'').split('·')[0]===p0));
  const rest=shuffle(all.filter(x=>!mates.includes(x)&&!same.includes(x)));
  const out=[],seen=new Set([w[field]]);
  for(const x of [...mates.slice(0,2),...same,...rest]){if(out.length>=n)break;if(seen.has(x[field]))continue;seen.add(x[field]);out.push(x);}
  return out;
}

function answer(ok){
  const q=S.quiz,s=curSess();if(!q||!s||q.answered)return;
  const it=s.items[q.idx],t=today();
  let p=S.P.get(it.id);p=p?{...p}:{lv:0,miss:0};
  const graded=!s.practice&&!it.r&&!it.x;let isNew=false;
  if(graded){
    if(!p.first){p.first=t;isNew=true;}
    const prev=p.lv||0;
    if(ok){p.lv=Math.min(5,prev+1);p.due=addDays(t,prev>=5?30:IV[p.lv]);p.lastOk=t;if(p.flag&&p.lastMiss!==t)p.flag=false;}
    else{p.lv=Math.max(0,prev-2);p.due=addDays(t,1);p.lastMiss=t;p.miss=(p.miss||0)+1;p.flag=true;}
  }else{
    if(ok){if(s.mode==='flag'&&!it.r)p.flag=false;}
    else{p.miss=(p.miss||0)+1;p.flag=true;}
  }
  p.seen=Date.now();S.P.set(it.id,p);saveNow('prog/'+it.id,p);
  if(!ok&&!it.r&&!it.x)s.items.push({id:it.id,t:'q',qt:it.qt,r:1});
  s.q=(s.q||0)+1;if(ok)s.ok=(s.ok||0)+1;else{s.miss=s.miss||[];if(!s.miss.includes(it.id))s.miss.push(it.id);}
  s.i=q.idx+1;
  logAnswer(t,ok,isNew,ok?null:it.id);
  const kind=q.kind;saveSoon(sessPath(kind),()=>kind==='today'?S.sess:S.psess,800);
  q.answered=true;q.ok=ok;q.self=false;renderQuiz();
}
function logAnswer(t,ok,isNew,missId){
  const ym=t.slice(0,7),dd=t.slice(8);
  const L=S.LOG[ym]||(S.LOG[ym]={days:{}});const D=L.days[dd]||(L.days[dd]={q:0,ok:0,nw:0,miss:[]});
  D.q++;if(ok)D.ok++;if(isNew)D.nw++;if(missId){D.miss=D.miss||[];if(!D.miss.includes(missId))D.miss.push(missId);}
  const st=S.stats;
  if(st.lastDay!==t){st.streak=st.lastDay===addDays(t,-1)?(st.streak||0)+1:1;st.lastDay=t;st.best=Math.max(st.best||0,st.streak);}
  st.days[t]=(st.days[t]||0)+1;

}

function parseWords(){
  const mg=S.mg;const inp=$('#add-in');mg.txt=inp?inp.value:mg.txt;
  const rows=mg.txt.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!rows.length){mg.err='추가할 단어를 적어 주세요.';mg.preview=null;render();return;}
  const have=new Set(allWords().map(w=>w.w.toLowerCase())),seen=new Set(),cards=[],bad=[],dups=[];
  for(const r of rows){const parts=r.split(/\s*=\s*/).map(x=>x.trim());const w=parts[0],m=parts[1]||'';
    if(!w)continue;const k=w.toLowerCase();if(seen.has(k))continue;seen.add(k);
    if(have.has(k)){dups.push(w);continue;}
    if(!m){bad.push(w);continue;}
    cards.push({...normCard({w,m,ex:parts[2]||'',ko:parts[3]||''}),on:true});}
  mg.dups=dups;
  if(mg.ls&&dups.length){const n=tagLesson(dups,mg.ls);if(n)toast(`이미 있는 ${n}개 단어에 ${lsName(mg.ls)} 표시를 붙였어요.`);}
  mg.err=bad.length?`뜻이 없어서 뺀 줄이 있어요: ${bad.join(', ')} · '영어 = 뜻' 모양으로 적어 주세요.`:'';
  mg.preview=cards.length?cards.slice(0,100):null;
  render();
}
function bracketIt(ex,w){if(!ex||/\[[^\]]+\]/.test(ex))return ex;const words=w.split(/\s+/).filter(x=>!/^(be|~|sb|sth|a|the)$/i.test(x));if(!words.length)return ex;const re=new RegExp('\\b('+words.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\w*\\s+(?:\\w+\\s+)?')+'\\w*)','i');return re.test(ex)?ex.replace(re,'[$1]'):ex;}
function normCard(x){const w=String(x.w).trim();return {w,pos:String(x.pos||''),ipa:String(x.ipa||'').replace(/^\/|\/$/g,''),kp:String(x.kp||''),m:String(x.m||''),c:CAT[x.c]?x.c:'daily',col:String(x.col||''),cm:String(x.cm||''),ex:bracketIt(String(x.ex||''),w),ko:String(x.ko||''),note:String(x.note||''),forms:String(x.forms||'')};}
function tagLesson(words,ls){let n=0;const keys=new Set(words.map(x=>x.toLowerCase()));
  for(const w of allWords()){if(!keys.has(w.w.toLowerCase())||(w.lss||[]).includes(ls))continue;saveWordField(w,{lss:[...(w.lss||[]),ls]});n++;}return n;}
function nextN(){return Math.max(1000,...[...S.W.values()].map(w=>w.n||0));}
function addUserWord(f,gr,chk=false){const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const w={...f,gr,n:nextN()+1,chk,at:Date.now()};S.W.set(id,{...w,id,src:'user'});saveNow('words/'+id,w);return id;}
const inBook=en=>{const k=String(en||'').trim().toLowerCase();return allWords().some(w=>w.w.toLowerCase()===k);};
function addFromDialog(d,list){
  list=list.filter(x=>x.en&&!inBook(x.en));if(!list.length){toast('이미 단어장에 있어요.');return;}
  const lineFor=en=>{const ks=en.toLowerCase().split(/\s+/).filter(x=>!/^(be|~|sb|sth|a|the)$/.test(x));const l=(d.lines||[]).find(l=>ks.every(k=>l.en.toLowerCase().includes(k)));return l||null;};
  const cards=list.map(x=>{const l=lineFor(x.en);return normCard({w:x.en,m:x.ko,c:'daily',ex:l?l.en:'',ko:l?l.ko:''});});
  let n=0;for(const c of cards){if(inBook(c.w))continue;addUserWord(c,0,true);n++;}
  toast(n?`${n}개를 단어장에 넣었어요. 오늘 학습에 새 단어로 나와요.`:'이미 단어장에 있어요.');render();
}
function saveAdded(){
  const mg=S.mg;if(!mg.preview)return;const pick=mg.preview.filter(x=>x.on);if(!pick.length){toast('저장할 단어를 골라 주세요.');return;}
  for(const x of pick){const {on,...f}=x;if(mg.ls)f.lss=[mg.ls];addUserWord(f,Number(mg.gr),true);}
  mg.preview=null;mg.txt='';mg.dups=[];toast(`${pick.length}개 단어를 저장했어요.`);render();
}
function saveEdit(){
  const w=S.W.get(S.mg.edit);if(!w)return;const f={};
  document.querySelectorAll('[data-ef]').forEach(el=>{let v=el.value.trim();if(el.dataset.ef==='gr')v=Number(v);if(el.dataset.ef==='lss')v=v.split(/[\s,]+/).map(x=>x.toUpperCase()).filter(x=>TB.lessons.some(l=>l[0]===x));f[el.dataset.ef]=v;});
  if(!f.w||!f.m){toast('영어와 뜻은 꼭 적어 주세요.');return;}
  if(f.ex&&!/\[[^\]]+\]/.test(f.ex)){toast('예문에서 외울 단어를 [ ]로 감싸 주세요.');return;}
  f.chk=true;saveWordField(w,f);
  S.mg.edit=null;toast('저장했어요.');render();
}
function delWord(id){
  const w=S.W.get(id);if(!w)return;
  if(w.src==='base')saveWordField(w,{hid:true});
  else{S.W.delete(id);queue('words/'+id,()=>S.db.doc('words/'+id).delete());}
  S.mg.edit=null;render();
  toast(`'${w.w}'를 지웠어요.`,()=>{if(w.src==='base')saveWordField(w,{hid:false});else{S.W.set(id,w);const {id:_,src,...rest}=w;saveNow('words/'+id,rest);}render();});
}
function checkQA(){
  const sp=S.sp;const inp=$('#qa-in');sp.qaTxt=inp?inp.value.trim():sp.qaTxt.trim();
  if(!sp.qaTxt){sp.err='먼저 영어로 답을 써 보세요.';render();return;}
  const q=QUESTIONS[sp.qa%QUESTIONS.length];
  sp.err='';sp.qaRes={kind:'check',items:checkWriting(sp.qaTxt,{starter:q.st,minSent:2,minWords:10})};
  render();
}

/* ---------- events ---------- */
const A={
  tab(el){S.tab=el.dataset.tab;closeSheet();render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+S.tab);}catch(e){}},
  settings(){openSettings();},
  'sheet-close'(){closeSheet();},
  'sheet-bg'(el,e){if(e.target===el)closeSheet();},
  set(el){const k=el.dataset.k;let v=el.dataset.v;if(k==='newPerDay'||k==='sessionSize')v=Number(v);S.set[k]=v;saveSettings();toast('저장했어요');openSettings();render();},
  lset(el){const k=el.dataset.k;let v=el.dataset.v;if(k==='auto')v=v==='true';ls.set(k,v);openSettings();},
  'deck-all'(){S.set.deck='all';saveSettings();render();},
  retry(){S.state='loading';render();boot();},
  start(){startToday();},
  resume(){openQuiz('today');},
  presume(){openQuiz('practice');},
  redo(){startPractice('redo',computeToday().done.map(w=>w.id),'오늘 공부한 단어');},
  tile(el){const k=el.dataset.k;
    if(k==='flag')startPractice('flag',flagged().map(w=>w.id),'다시 보기 단어');
    else if(k==='often')startPractice('often',often().map(w=>w.id),'자주 틀리는 단어');
    else if(k==='spell')startPractice('spell',learnedWords().map(w=>w.id),'문장 완성');
    else if(k==='kw')startPractice('kw',learnedWords().map(w=>w.id),'우리말 → 영어 쓰기');
    else if(k==='test')openTestPicker();
    else{S.tab='speak';render();window.scrollTo(0,0);}},
  cal(el){const [y,m]=S.cal.split('-').map(Number);const d=new Date(y,m-1+Number(el.dataset.d),1);S.cal=d.getFullYear()+'-'+pad(d.getMonth()+1);S.calDay=null;render();},
  day(el){S.calDay=S.calDay===el.dataset.d?null:el.dataset.d;render();},
  'day-close'(){S.calDay=null;render();},
  'day-redo'(el){const ds=el.dataset.d;const L=(S.LOG[ds.slice(0,7)]||{days:{}}).days[ds.slice(8)];startPractice('day',((L&&L.miss)||[]).filter(id=>S.W.has(id)),krDate(ds).replace(/ \S+요일$/,'')+' 틀린 단어');},
  backup(){backup();},
  'upd-go'(){flush();idle().then(()=>location.reload());},
  'upd-x'(){$('#upd').hidden=true;},
  install(){if(!installEvt)return;installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render();});},
  'install-x'(){ls.set('installHid',true);render();toast('설정 > 앱 설치 안내에서 다시 볼 수 있어요.');},
  'install-show'(){ls.set('installHid',false);closeSheet();S.tab='today';render();window.scrollTo(0,0);},
  say(el){speak(el.dataset.t,el.dataset.r?{rate:Number(el.dataset.r)}:{});},
  reveal(el){el.hidden=true;const n=el.nextElementSibling;if(n)n.hidden=false;},
  undo(){const u=toast.undo;$('#toast').hidden=true;toast.undo=null;if(u)u();},
  'bk-open'(el){S.bk.open=S.bk.open===el.dataset.id?null:el.dataset.id;render();},
  'bk-more'(){S.bk.limit+=80;render();},
  flag(el){const id=el.dataset.id;let p=S.P.get(id);p=p?{...p}:{lv:0,miss:0};p.flag=!p.flag;S.P.set(id,p);saveNow('prog/'+id,p);toast(p.flag?'다시 보기에 넣었어요':'다시 보기에서 뺐어요');render();},
  edit(el){S.mg.edit=el.dataset.id;S.tab='manage';render();setTimeout(()=>{const c=$('#edit-card');if(c)c.scrollIntoView({block:'start'});},30);},
  'edit-close'(){S.mg.edit=null;render();},
  'edit-save'(){saveEdit();},
  'edit-del'(){delWord(S.mg.edit);},
  chk(el){const w=S.W.get(el.dataset.id);if(!w)return;saveWordField(w,{chk:true});toast('확인했어요');render();},
  'add-parse'(){parseWords();},
  'imp-go'(){importBackup();},
  'imp-cancel'(){S.imp=null;render();},
  'pt-add'(el){const d=S.dlg.find(x=>x.id===S.sp.open);if(!d)return;const p=d.points[Number(el.dataset.i)];if(p)addFromDialog(d,[p]);},
  'pt-all'(){const d=S.dlg.find(x=>x.id===S.sp.open);if(d)addFromDialog(d,d.points);},
  'ex-del'(el){const w=S.W.get(el.dataset.id);if(!w)return;const i=Number(el.dataset.i);const old=(w.exs||[]).slice();const exs=old.filter((_,k)=>k!==i);saveWordField(w,{exs});render();toast('예문을 지웠어요.',()=>{saveWordField(w,{exs:old});render();});},
  'my-open'(el){S.my={id:el.dataset.id,txt:'',ko:'',res:null};render();setTimeout(()=>{const t=$('#my-in');if(t)t.focus();},30);},
  'my-close'(){S.my=null;render();},
  'my-check'(el){checkMine(el.dataset.id);},
  'my-save'(el){const w=S.W.get(el.dataset.id),my=S.my;if(!w||!my)return;const ex=hasWordIn(my.txt,w);if(!ex){toast(`문장에 '${w.w}'를 넣어 주세요.`);return;}const exs=[...(w.exs||[]),{ex,ko:(my.ko||'').trim(),mine:true}].slice(-9);saveWordField(w,{exs});S.my=null;toast('내 문장을 예문에 넣었어요.');render();},
  'add-save'(){saveAdded();},
  'add-cancel'(){S.mg.preview=null;render();},
  quit(){closeQuiz();},
  'card-ok'(){const s=curSess();if(!s)return;const kind=S.quiz.kind;s.i=S.quiz.idx+1;saveSoon(sessPath(kind),()=>kind==='today'?S.sess:S.psess,800);nextQ();},
  pick(el){const q=S.quiz;if(!q||q.answered)return;const i=Number(el.dataset.i);q.pick=i;answer(!!q.opts[i].ok);},
  next(){nextQ();},
  hint(){const q=S.quiz;const inp=$('#spell');if(inp)q.input=inp.value;q.hint=true;renderQuiz();},
  'spell-check'(){checkSpell();},
  self(el){if(S.quiz)answer(el.dataset.v==='1');},
  'test-start'(el){closeSheet();startTest(el.dataset.k);},
  'test-next'(){testNext();},
  'test-finish'(){finishTest();},
  tself(el){const s=S.psess;if(!s)return;const it=s.items[Number(el.dataset.i)];if(!it)return;it.res=it.res||{input:''};it.res.self=el.dataset.v==='1';saveSoon('meta/psession',()=>S.psess,800);renderQuiz();},
  'test-redo'(){const s=S.psess;const ids=(s&&s.miss||[]).slice();const title=(s&&s.title||'')+' 틀린 단어';closeQuiz();startPractice('flag',ids,title);},
  'spell-skip'(){if(S.quiz.self)return;const inp=$('#spell');S.quiz.input=inp?inp.value.trim():'';answer(false);},
  'sum-more'(){const kind=S.quiz.kind;closeQuiz();if(kind==='today')startToday();},
  'sp-sub'(el){S.sp.sub=el.dataset.k;S.sp.err='';render();},
  'sp-hide'(){S.sp.hide=!S.sp.hide;render();},
  'sh-check'(){const w0=S.W.get(S.sp.sh);const ex=S.sp.shx!=null&&w0.exs&&w0.exs[S.sp.shx]?w0.exs[S.sp.shx].ex:w0.ex;const inp=$('#sh-in');S.sp.txt=inp?inp.value:'';if(!S.sp.txt.trim()){toast('들은 문장을 말하거나 써 주세요.');return;}S.sp.res=compare(exPlain(ex),S.sp.txt);render();},
  'sh-next'(){S.sp.sh=pickShadow();S.sp.txt='';S.sp.res=null;render();},
  'qa-ex'(){S.sp.qaRes={kind:'ex'};const inp=$('#qa-in');if(inp)S.sp.qaTxt=inp.value;render();},
  'qa-next'(){S.sp.qa++;S.sp.qaTxt='';S.sp.qaRes=null;S.sp.err='';render();},
  'qa-check'(){checkQA();},
  scene(el){S.sp.scene=el.dataset.s;render();},
  'dl-open'(el){S.sp.open=el.dataset.id;S.sp.role=null;S.sp.shown=[];render();window.scrollTo(0,0);},
  'dl-back'(){S.sp.open=null;try{speechSynthesis.cancel();}catch(e){}render();},
  'dl-ko'(){S.sp.ko=!S.sp.ko;render();},
  'dl-role'(el){S.sp.role=S.sp.role===el.dataset.r?null:el.dataset.r;S.sp.shown=[];render();},
  'dl-show'(el){(S.sp.shown=S.sp.shown||[]).push(Number(el.dataset.i));render();},
  'dl-play'(){const d=S.dlg.find(x=>x.id===S.sp.open);if(d)speakSeq(d.lines.map(l=>({text:l.en,pitch:l.who==='B'?1.25:0.9})));},
  'dl-del'(el){const id=el.dataset.id;const i=S.dlg.findIndex(d=>d.id===id);if(i<0)return;const d=S.dlg[i];S.dlg.splice(i,1);S.sp.open=null;queue('dialogs/'+id,()=>S.db.doc('dialogs/'+id).delete());render();
    toast('대화를 지웠어요.',()=>{S.dlg.splice(i,0,d);const {id:_,...rest}=d;saveNow('dialogs/'+id,rest);render();});}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){f(el,e);}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='bk-q'){S.bk.q=t.value;S.bk.limit=80;clearTimeout(A._bt);A._bt=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('#bk-q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);}
  else if(t.id==='mg-q'){S.mg.q=t.value;clearTimeout(A._mt);A._mt=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('#mg-q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);}
  else if(t.id==='add-in')S.mg.txt=t.value;
  else if(t.id==='sh-in')S.sp.txt=t.value;
  else if(t.id==='qa-in')S.sp.qaTxt=t.value;
  else if(t.id==='my-in'&&S.my){S.my.txt=t.value;}
  else if(t.id==='my-ko'&&S.my)S.my.ko=t.value;
  else if(t.id==='spell'&&S.quiz)S.quiz.input=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bk-gr'){S.bk.gr=t.value;S.bk.limit=80;render();}
  else if(t.id==='bk-c'){S.bk.c=t.value;S.bk.limit=80;render();}
  else if(t.id==='bk-st'){S.bk.st=t.value;S.bk.limit=80;render();}
  else if(t.id==='bk-ls'){S.bk.ls=t.value;S.bk.limit=80;render();}
  else if(t.id==='add-ls')S.mg.ls=t.value;
  else if(t.id==='add-gr')S.mg.gr=Number(t.value);
  else if(t.id==='imp-file'&&t.files&&t.files[0]){const f=t.files[0];const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||(!d.progress&&!d.words))throw 0;
      S.imp={name:f.name,data:d,nw:(d.words||[]).filter(w=>w&&!S.baseW.has(w.id)).length,np:Object.keys(d.progress||{}).length,nd:Object.keys((d.stats&&d.stats.days)||{}).length};}
    catch(e){S.imp={err:'단어장 백업 파일이 아니에요. "지금 백업하기"로 만든 .json 파일을 골라 주세요.'};}render();};r.readAsText(f);t.value='';}
  else if(t.dataset&&t.dataset.pv!=null&&S.mg.preview){S.mg.preview[Number(t.dataset.pv)].on=t.checked;const b=document.querySelector('[data-act="add-save"]');if(b)b.textContent=`고른 단어 저장 (${S.mg.preview.filter(x=>x.on).length})`;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return;}
  const q=S.quiz;if(!q)return;
  if(e.target&&e.target.id==='spell'){if(e.key==='Enter'){e.preventDefault();const s=curSess();if(s&&s.test)testNext();else checkSpell();}return;}
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(q.answered&&e.key==='Enter'){e.preventDefault();nextQ();return;}
  if(!q.answered&&q.opts&&/^[1-4]$/.test(e.key)){const i=Number(e.key)-1;if(q.opts[i]){q.pick=i;answer(!!q.opts[i].ok);}}
});

/* ---------- offline + updates ---------- */
let lastCheck=0;
function checkUpdate(){
  const sw=navigator.serviceWorker&&navigator.serviceWorker.controller;if(!sw)return;
  if(Date.now()-lastCheck<5*60000)return;lastCheck=Date.now();
  const ch=new MessageChannel();
  ch.port1.onmessage=e=>{const d=e.data||{};if(d.type==='checked'&&d.changed&&d.changed.length)$('#upd').hidden=false;};
  try{sw.postMessage({type:'check'},[ch.port2]);}catch(e){}
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(()=>checkUpdate()).catch(e=>console.warn('sw',e));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
}
// ask the browser not to clear the learner's records when space runs low (granted silently or ignored)
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist();});}catch(e){}

const h=(location.hash||'').slice(1);if(['today','book','speak','manage'].includes(h))S.tab=h;
boot();
})();
